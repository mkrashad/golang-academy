openapi: 3.0.3
info:
  title: Movies API
  version: 1.0.0
  description: API to manage movies and their characters

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /movie:
    get:
      summary: Get all movies
      responses:
        '200':
          description: A list of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharacterMovie'
    post:
      summary: Create a new movie with a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterMovie'
      responses:
        '201':
          description: Movie and character added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Movie and character added successfully
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /movie/{id}:
    delete:
      summary: Delete a movie by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Movie ID
      responses:
        '200':
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Movie with ID 1 deleted successfully
        '400':
          description: Invalid or missing id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a movie by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Movie ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterMovie'
      responses:
        '200':
          description: Movie updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Movie with ID 1 updated successfully
        '400':
          description: Invalid JSON body or invalid/missing id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: The Matrix
        year:
          type: integer
          example: 1999

    Character:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Neo

    CharacterMovie:
      type: object
      properties:
        movie:
          $ref: '#/components/schemas/Movie'
        character:
          $ref: '#/components/schemas/Character'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid JSON body
